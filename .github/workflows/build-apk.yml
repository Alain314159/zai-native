name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        env:
          ZAI_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ZAI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ZAI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_AVAILABLE: ${{ steps.keystore.outputs.available }}
        run: |
          chmod +x gradlew
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease \
              -PzaiSigningConfig=true \
              -PzaiStorePassword="$ZAI_STORE_PASSWORD" \
              -PzaiKeyAlias="$ZAI_KEY_ALIAS" \
              -PzaiKeyPassword="$ZAI_KEY_PASSWORD" \
              --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.available == 'true'
        with:
          name: zai-native-release
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.available != 'true'
        with:
          name: zai-native-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zai-native-release
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
